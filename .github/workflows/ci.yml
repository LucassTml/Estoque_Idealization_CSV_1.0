name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estoque_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/estoque_test' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes (pytest + cobertura)
        run: uv run pytest -p no:logging --cov --cov-report=term --cov-report=xml
      - name: Contrato OpenAPI atualizado
        if: matrix.database == 'sqlite'
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- openapi.json || (echo "::error::Rode 'uv run python -m scripts.export_openapi' e commite o openapi.json" && exit 1)

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos da API sincronizados com o backend
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "::error::Rode 'npm run gen:api' e commite src/api/schema.d.ts" && exit 1)
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tipos (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Testes unitários (vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-dev
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Imagem Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t estoque-idealization:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=ci-secret-key-0123456789abcdefghijklmnop -e DEMO_MODE=true estoque-idealization:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 2; done
          curl -fsS http://localhost:8000/ | grep -q "Estoque Idealization"
          curl -fsS -X POST http://localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.com","password":"demo1234"}' | grep -q access_token
      - if: failure()
        run: docker logs app
