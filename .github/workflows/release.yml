name: Release

# Ao criar uma tag v* (ex.: git tag v2.0.0 && git push --tags):
#  - gera os executáveis portáteis para Windows e Linux e anexa ao GitHub Release;
#  - publica a imagem Docker no GitHub Container Registry (ghcr.io).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  portable:
    name: Executável (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: EstoqueIdealization-windows.exe
          - os: ubuntu-latest
            artifact: EstoqueIdealization-linux
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build do frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build do executável (PyInstaller)
        working-directory: backend
        run: |
          uv sync --locked --group desktop
          uv run pyinstaller ../desktop/estoque.spec --noconfirm --distpath dist --workpath build
      - name: Renomear
        shell: bash
        run: |
          cd backend/dist
          if [ -f EstoqueIdealization.exe ]; then mv EstoqueIdealization.exe ${{ matrix.artifact }}; else mv EstoqueIdealization ${{ matrix.artifact }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: backend/dist/${{ matrix.artifact }}

  publish:
    name: Publicar release
    needs: portable
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  image:
    name: Imagem Docker (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
